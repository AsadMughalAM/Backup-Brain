name: backup_brain
description: "Backup Brain - AI home energy manager for load-shedding"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bb_ui:
    path: ../packages/bb_ui
  cloud_firestore: ^6.10.0
  energy_engine:
    path: ../packages/energy_engine
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  fake_cloud_firestore: ^4.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  # Stock Material widgets (e.g. the AppBar back arrow) still draw Material
  # glyphs; our own code uses BbIcons only.
  uses-material-design: true
  assets:
    - assets/data/
